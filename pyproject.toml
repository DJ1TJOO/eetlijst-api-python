[project]
name = "eetlijst-python"
version = "0.0.1"
description = "Python rewrite of the Eetlijst GraphQL client"
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
  "httpx>=0.28",
  "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
  "ariadne-codegen>=0.18",
  "mypy>=1.8.0",
  "black>=24.0",
  "isort>=5.13",
  "pylint>=3.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.ariadne-codegen]
schema_path = "schema.graphql"
queries_path = "src/eetlijst/services"
target_package_name = "generated"
target_package_path = "src/eetlijst"
include_comments = "none"
client_name = "GraphQlClient"

[tool.ariadne-codegen.scalars.uuid]
type = "str"

[tool.ariadne-codegen.scalars.timestamptz]
type = "datetime.datetime"
deserialize = "iso8601.parse_date"

[tool.pylint.main]
ignore-paths = [
    "src/eetlijst/generated"
]

[tool.pylint.messages_control]
disable = [
    "duplicate-code",
    "too-many-arguments",
    "too-many-positional-arguments",
    "line-too-long",
    "missing-module-docstring",
    "missing-class-docstring",
    "missing-function-docstring",
    "bare-except",
    "too-many-branches",
    "too-many-locals",
    "too-few-public-methods",
    "too-many-public-methods",
    "fixme"
]

[tool.pylint.BASIC]
typevar-rgx = "^_?[A-Z][a-zA-Z0-9_]*$"

[tool.black]
exclude = "src/eetlijst/generated"

[tool.isort]
profile = "black"
skip = [
    "src/eetlijst/generated"
]
sections = [
    "FUTURE",
    "STDLIB",
    "THIRDPARTY",
    "GENERATED",
    "SRC",
    "SERVICES",
    "UTILS",
    "FIRSTPARTY",
    "LOCALFOLDER"
]
known_generated = ["eetlijst.generated"]
known_src = ["eetlijst"]
known_services = ["eetlijst.services"]
known_utils = ["eetlijst.utils"]

[tool.mypy]
exclude = "src/eetlijst/generated"
check_untyped_defs = true
warn_redundant_casts = true
disallow_any_generics = true
disallow_any_unimported = true