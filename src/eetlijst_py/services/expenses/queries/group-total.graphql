query GroupTotalExpense($groupId: uuid) {
	eetschema_expense_aggregate(
		where: { group_id: { _eq: $groupId }, deleted: { _eq: false } }
	) {
		aggregate {
			sum {
				payed_amount
			}
		}
	}
	eetschema_expense_eetlijst_import_aggregate(
		where: { group_id: { _eq: $groupId } }
	) {
		aggregate {
			sum {
				payed_amount
			}
		}
	}
}
