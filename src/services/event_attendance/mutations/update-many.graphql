mutation UpdateManyAttendance(
	$updates: [eetschema_event_attendees_insert_input!]!
) {
	insert_eetschema_event_attendees(
		objects: $updates
		on_conflict: {
			constraint: event_attending_members_pkey
			update_columns: [
				status
				number_guests
				user_changed_status
				comment
			]
		}
	) {
		returning {
			...AttendanceFields
		}
	}
}
